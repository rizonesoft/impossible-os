# Fusion escalation config -- the apex tier of the Claude -> Codex -> Fusion ladder.
# See .fusion/README.md for how to enable. Off unless FUSION_ENABLED=1 + a secret.

# Panel (analysis_models): three strong, architecturally-diverse coders, none of
# them a model already in the ladder (Claude/GPT) -- the point is fresh blind spots.
# IDs verified against the OpenRouter model list 2026-06-27 (kimi-k2.7 does NOT
# exist; the coding variant is kimi-k2.7-code -- an invalid id is silently dropped).
panel = ["z-ai/glm-5.2", "moonshotai/kimi-k2.7-code", "deepseek/deepseek-v4-pro"]
# Judge (Fusion's built-in synthesizer): a CHEAP in-Fusion synthesizer. NOT Opus --
# we already pay for Opus in the main Claude thread, which reads Fusion's output and
# validates it before acting (the WS8 trust contract). That main-thread review IS
# the Opus-grade "judge", for free; paying OpenRouter for a duplicate Opus judge was
# paying twice. GLM 5.2 just does the basic panel synthesis.
judge = "z-ai/glm-5.2"

# Spend caps.
max_calls = 3        # hard per-run Fusion call cap (FUSION_MAX_CALLS)
min_credits = 2.0    # skip if OpenRouter remaining balance is below this (USD)
timeout_s = 240      # per-call wall-clock bound
