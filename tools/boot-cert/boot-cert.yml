# Boot Certification Matrix -- TODO-28 (boot certification matrix schema).
# Every boot-platform TODO (01-29) maps to >=1 certification row binding its
# boot promise to platforms, the release tiers it is required for, and the
# machine-readable evidence the release gate reads. Validated by lint.py
# (shape + cross-field invariants + every-TODO-has-a-row coverage).
version: 1

platform_classes:
  - qemu-whpx
  - qemu-tcg
  - virtualbox
  - hyperv
  - baremetal-desktop-sata
  - baremetal-laptop-nvme
  - baremetal-usb-only
  - baremetal-secureboot-tpm
  - baremetal-no-tpm

tiers: [nightly, rc, stable]

# Shared shorthand: most automated rows run on the VM classes and gate stable on
# qemu-whpx (the CI-gating platform), with broader nightly coverage. Bare-metal
# and visual rows are manual with an evidence template.
rows:
  - id: boot-abi-handoff
    feature: boot_info ABI handoff valid + magic/version accepted
    owner_todo: TODO-01
    gate_kind: boot
    platforms: [qemu-whpx, qemu-tcg, virtualbox, hyperv]
    required_for: { nightly: [qemu-whpx, qemu-tcg], rc: [qemu-whpx], stable: [qemu-whpx] }
    automation_level: auto
    source_artifact: boot-cert-results.json

  - id: uefi-secureboot-state
    feature: Secure Boot state + variable hardening
    owner_todo: TODO-02
    gate_kind: security
    platforms: [qemu-whpx, baremetal-secureboot-tpm]
    required_for: { nightly: [qemu-whpx], stable: [qemu-whpx] }
    automation_level: auto
    source_artifact: boot-cert-results.json

  - id: bootloader-error-recovery
    feature: bootloader degraded-path + fallback chains
    owner_todo: TODO-03
    gate_kind: recovery
    platforms: [qemu-whpx, qemu-tcg]
    required_for: { nightly: [qemu-whpx, qemu-tcg], stable: [qemu-whpx] }
    automation_level: auto
    source_artifact: boot-cert-results.json

  - id: firmware-tables
    feature: firmware-table sanity (ACPI/SMBIOS/MAT/RT) validation
    owner_todo: TODO-04
    gate_kind: firmware
    platforms: [qemu-whpx, qemu-tcg, baremetal-desktop-sata, baremetal-laptop-nvme]
    required_for: { nightly: [qemu-whpx], stable: [qemu-whpx] }
    automation_level: auto
    source_artifact: firmware-tables.json

  - id: boot-storage-stack
    feature: boot-time storage stack bring-up
    owner_todo: TODO-05
    gate_kind: storage
    platforms: [qemu-whpx, qemu-tcg]
