# The lanes that may commit to Impossible OS, and what each one owns (TODO-08 section 49).
# Design and the reasons behind each lane: docs/plans/2026-11-20-parallel-lanes.md.
#
# Read only through scripts/lanes.py, which refuses a map it cannot fully validate.
# - main owns everything no live extra lane owns, so its paths stay empty.
# - An extra lane reserves its paths only while it is live (its record under
#   $XDG_STATE_HOME/impossible-os/lanes/ is fresh), and it may commit only inside them.
# - paths: a directory prefix ends in "/", anything else is one file. No two lanes may overlap.
# - worktree: relative to the primary tree.
# - output: "commits", or "reports" for a lane that never commits.
# - limits: the systemd scope a lane runs in (section 52 applies them).

# A record whose heartbeat is older than this is a lane that is no longer live.
stale_secs = 180

# Written by tooling on every lane's commits, so any lane may commit them.
generated = [
    "COUNT.md",
    "README.md",
    "todo/implementation-plan.md",
    "docs/test-coverage/coverage.md",
    "docs/test-coverage/coverage.json",
    "docs/infrastructure/todo-graph.md",
]

[lane.main]
engine = "claude"
model = "opus"
worktree = "."
paths = []
output = "commits"
limits = { memory = "16G", cpu = "400%" }

[lane.userland]
engine = "claude"
model = "opus"
worktree = "../impossible-os-userland"
paths = ["user/", "src/apps/", "src/shell/", "todo/11-apps/"]
output = "commits"
limits = { memory = "6G", cpu = "200%" }

[lane.neon-a]
engine = "agy"
model = "gemini-4-neon-high"
worktree = "../impossible-os-neon-a"
paths = ["scripts/inventory/", "docs/design/inventory/", "todo/08-graphics-ui/TODO-17-win11-parity-inventory.md"]
output = "commits"
limits = { memory = "4G", cpu = "100%" }

[lane.neon-b]
engine = "agy"
model = "gemini-4-neon-high"
worktree = "../impossible-os-neon-b"
paths = []
output = "reports"
limits = { memory = "4G", cpu = "100%" }
