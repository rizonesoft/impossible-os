# Conclave connector for impossible-os -- this project's escalation-ladder config.
# The engine + data + key live in ~/conclave (github.com/rizonetech/Conclave);
# this file only configures how THIS project plugs in. Nothing secret here.

[project]
id   = "impossible-os"
home = "~/conclave"          # CONCLAVE_HOME overrides

# The escalation ladder is project-side: Claude (tier 3) -> Codex (tier 2) -> Conclave (tier 1).
[ladder]
stuck_after  = 3             # consecutive same-target build/test/smoke failures before nudging the ladder
codex_rounds = 2             # tier-2 Codex rescue rounds before a tier-1 Conclave dispatch
