# Reviewer pin and review schedule for Impossible OS. Same format as RasterFold's pin (schema_version 1).
#
# Operator decision 2026-11-10: when Claude is the writer, the reviewer is always GPT-6 Astra through the Codex CLI.
# One route, one reviewer, no fallback. An outage is never an approval.
# Operator decision 2026-11-11: the review shape follows RasterFold's three passes. It is four here, on evidence:
# replayed on shipped sections the same day, one combined round found one of four known performance defects that
# the dedicated performance review had found, so performance stays a pass of its own
# (docs/specs/2026-11-11-three-pass-review-design.md, Replay).
#   - before the build, one plan review (kind plan);
#   - after the build and its gates, one round carrying every defect lens (kind round);
#   - one performance review (kind performance);
#   - on the final candidate, one completion review (kind completion).
# The round and the performance pass are dispatched again after their findings are fixed. A section is stamped when
# the round, the performance pass and the completion pass each ended below a blocking level on the candidate being
# stamped.
# A completion that returns gaps is repaired and followed by a reconciliation pass (kind reconciliation), up to
# pass_cap returned passes per section in all. no_progress_cap ends a loop whose passes stop finding anything new.
# Each lens has one owner: the round hunts defects, the completion pass checks delivery and the record.
# Findings are tagged P1, P2 or P3. Only the levels in `blocking` hold the stamp; the rest are filed as tracked
# items and spend no further passes. A [[schedule.conditional]] entry adds its lenses to the named passes only
# when the section's changed files fall under one of its paths.
# A section keeps the schedule it started under, so sections already under review finish on the earlier rules.
#
# `model` is a declaration, never a flag: the dispatcher refuses when ~/.codex/config.toml names a different model.
# There is no `effort` key here. Reasoning effort is the operator's dial in the Codex config.

schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"

[routes]
claude = ["astra"]

[schedule]
policy = "four-pass"
pass_cap = 55
no_progress_cap = 5
blocking = ["P1", "P2"]

[schedule.plan]
lenses = ["plan"]

[[schedule.rounds]]
lenses = ["adversarial", "integration", "source-defect", "consistency", "quality", "test-coverage"]

[schedule.performance]
lenses = ["optimization"]

[schedule.completion]
lenses = ["plan-delivery", "record"]

[schedule.reconciliation]
lenses = ["adversarial", "integration", "plan-delivery", "record"]

[[schedule.conditional]]
lenses = ["concurrency", "bare-metal"]
passes = ["round", "reconciliation"]
paths = ["src/kernel/", "include/kernel/", "src/boot/"]

[[schedule.conditional]]
lenses = ["design"]
passes = ["plan", "round"]
paths = ["src/desktop/", "src/shell/", "src/apps/", "user/", "gh-pages/"]
