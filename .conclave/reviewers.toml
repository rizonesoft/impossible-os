# Reviewer pin and review schedule for Impossible OS. Same format as RasterFold's pin (schema_version 1).
#
# Operator decision 2026-11-10: when Claude is the writer, the reviewer is always GPT-6.2 Astra (moved from GPT-6 on 2026-11-17) through the Codex CLI.
# One route, one reviewer, no fallback. An outage is never an approval.
# Operator decision 2026-11-14: an outage is a delay, and it does not stop the run. A section built while the
# reviewer is down is recorded as owed (scripts/overnight/review_owed.py), nothing is pushed while a debt is
# open, and the owed sections are reviewed in full, first, when the reviewer answers.
# Operator decision 2026-11-11: the review shape follows RasterFold's three passes. It is four here, on evidence:
# replayed on shipped sections the same day, one combined round found one of four known performance defects that
# the dedicated performance review had found, so performance stays a pass of its own
# (docs/specs/2026-11-11-three-pass-review-design.md, Replay).
#   - before the build, one plan review (kind plan);
#   - after the build and its gates, one round carrying every defect lens (kind round);
#   - one performance review (kind performance);
#   - on the final candidate, one completion review (kind completion).
# The round and the performance pass are dispatched again after their findings are fixed. A section is stamped when
# the round, the performance pass and the completion pass each ended below a blocking level on the candidate being
# stamped.
# A completion that returns gaps is repaired and followed by a reconciliation pass (kind reconciliation), up to
# pass_cap returned passes per section in all. pass_cap is the only cap on a loop (no_progress_cap removed
# 2026-11-20, see [schedule]).
# Each lens has one owner: the round hunts defects, the completion pass checks delivery and the record.
# Findings are tagged P1, P2 or P3. Only the levels in `blocking` hold the stamp; the rest are filed as tracked
# items and spend no further passes. A [[schedule.conditional]] entry adds its lenses to the named passes only
# when the section's changed files fall under one of its paths.
# A section keeps the schedule it started under, so sections already under review finish on the earlier rules.
# Operator decision 2026-11-17: GPT-6.2 Astra was released and replaces GPT-6 Astra (`gpt-6.2-astra` through the
# Codex CLI). The dispatcher holds every pass to the model in ~/.codex/config.toml, so sections already under review
# continue on GPT-6.2 Astra.
#
# `model` is a declaration, never a flag: the dispatcher refuses when ~/.codex/config.toml names a different model.
# There is no `effort` key here. Reasoning effort is the operator's dial in the Codex config.

schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6.2-astra"

[routes]
claude = ["astra"]

[schedule]
policy = "four-pass"
pass_cap = 33
# Owner decision 2026-11-20: no stall cap. The 2026-11-19 rule (no_progress_cap = 3, progress by severity outside
# deep_paths) ended desktop, shell, apps, user and site repair chains after three passes whose worst finding did
# not fall, so a chain stopped for want of progress rather than for being clean. A loop now ends when its passes
# come back below `blocking`, or at pass_cap (33 since 2026-11-19). deep_paths chose between the two stall rules
# and went with them. Keeping chains short is the reconciliation's job: it reviews the newest repair only.
blocking = ["P1", "P2"]

[schedule.plan]
lenses = ["plan"]

[[schedule.rounds]]
lenses = ["adversarial", "integration", "source-defect", "consistency", "quality", "test-coverage"]

[schedule.performance]
lenses = ["optimization"]

[schedule.completion]
lenses = ["plan-delivery", "record"]

# Owner decision 2026-11-20: every reconciliation, in every part of the tree, also attacks the newest repair:
# plan-delivery and record check that the named gaps are closed, repair-adversarial and repair-integration hunt
# the bugs the repair itself brings in. Both are scoped to the repair (the dispatcher names the last reviewed
# candidate and the repaired candidate), so a reconciliation never re-attacks the whole section, which is what
# grew 15 to 19 pass chains before 2026-11-19. Kernel and boot repairs keep full adversarial and integration
# on top (the conditional entry below). Effort is the operator's Codex setting, as for every pass.
[schedule.reconciliation]
lenses = ["plan-delivery", "record", "repair-adversarial", "repair-integration"]

# The pin's own lenses (owner decision 2026-11-20), each a question for the newest repair only.
[schedule.lenses]
repair-adversarial = "In the newest repair only (the last reviewed candidate to the repaired candidate, both named above): how does the newest repair fail on hostile input, races, aborts, cancellation, automation or links? Code an earlier pass reviewed and the repair left unchanged is out of scope."
repair-integration = "In the newest repair only (the last reviewed candidate to the repaired candidate, both named above): what does the newest repair break in a caller, a contract, another component or an installed copy?"

[[schedule.conditional]]
lenses = ["adversarial", "integration"]
passes = ["reconciliation"]
paths = ["src/kernel/", "include/kernel/", "src/boot/"]

[[schedule.conditional]]
lenses = ["concurrency", "bare-metal"]
passes = ["round", "reconciliation"]
paths = ["src/kernel/", "include/kernel/", "src/boot/"]

[[schedule.conditional]]
lenses = ["design"]
passes = ["plan", "round"]
paths = ["src/desktop/", "src/shell/", "src/apps/", "user/", "gh-pages/"]
