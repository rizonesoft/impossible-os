# .asm-lsp.toml -- asm-lsp configuration for Impossible OS
#
# asm-lsp (bergercookie/asm-lsp) defaults to GAS syntax. Our assembly
# files under src/boot/ and src/kernel/ are NASM syntax (x86-64 long
# mode); without this pin, every `mov`, `jmp`, label definition, and
# macro would parse wrong and diagnostics would be pure noise.
#
# Owner: TODO-07 asm-lsp Integration (NASM) in 00-infrastructure.
# Consumed by: scripts/lsp-mcp/servers/asm_server.py (bridge spawn
# recipe) and, on human developer hosts, by any editor with an
# asm-lsp client (VS Code, Emacs, Neovim).

[default_config]
assembler = "nasm"
# asm-lsp's config schema enum uses hyphenated spellings. Two
# valid values here: "x86-64" (long mode only) or "x86/x86-64"
# (dual mode, 32-bit + 64-bit). src/boot/entry.asm starts in
# [BITS 32] (lines 19, 262) and switches to [BITS 64] (line 221)
# for the multiboot2 / UEFI-handoff path, so the dual-mode pin is
# correct -- an x86-64-only pin parses 32-bit instructions with
# the wrong register width and the wrong operand-size defaults,
# masking real errors during hover / diagnostics.
# Schema reference:
# https://github.com/bergercookie/asm-lsp/blob/master/asm-lsp_config_schema.json
instruction_set = "x86/x86-64"

[default_config.opts]
# asm-lsp upstream default tries gcc -> clang fallback for diagnostics
# on .asm files. That fallback is meaningless for a NASM-only
# workspace -- gcc/clang treat .asm as GAS syntax and emit a flood of
# false errors. Disable both the per-call diagnostics path and the
# default-compiler fallback so hover / definition / references stay
# functional while diagnostics fall back silently. Build correctness
# is asserted by `nasm` itself during scripts/build.sh, not by the
# LSP. Codex consistency review of asm_server's spawn recipe accepted
# the deferral in TODO-07's asm integration; the LSP-MCP integration
# section closes it.
diagnostics = false
default_diagnostics = false
