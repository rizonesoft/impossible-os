name: ✨ Feature Request
description: Suggest a new feature or improvement for Impossible OS
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Impossible OS? We'd love to hear it! Please check the [TODO roadmap](https://github.com/rizonesoft/impossible-os/tree/main/todo) first to see if it's already planned.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you'd like.
      placeholder: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Proposed Implementation
      description: If you have ideas on how this could be implemented, describe them here.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the OS would this affect?
      options:
        - Kernel
        - Bootloader
        - Desktop / Window Manager
        - Drivers
        - Filesystem
        - Networking
        - Userland / Shell
        - Build System
        - Other
    validations:
      required: true

  - type: checkboxes
    id: roadmap-check
    attributes:
      label: Roadmap Check
      options:
        - label: I've checked the TODO roadmap and this feature isn't planned yet
          required: true
