name: 🖥️ Hardware Compatibility Report
description: Report whether Impossible OS boots on your hardware
labels: [hardware-compat]
body:
  - type: markdown
    attributes:
      value: |
        Help us build a hardware compatibility list! Report your results booting Impossible OS on real hardware.

  - type: input
    id: hardware-model
    attributes:
      label: Hardware Model
      description: Make and model of your computer.
      placeholder: "e.g., Acer Aspire E5-575G, Dell XPS 13 9310"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "e.g., Intel Core i7-7500U, AMD Ryzen 5 5600X"
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: RAM
      placeholder: "e.g., 8 GB DDR4"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "e.g., NVIDIA GeForce 940MX, Intel UHD 620, AMD Radeon RX 580"
    validations:
      required: true

  - type: input
    id: storage
    attributes:
      label: Storage Type
      placeholder: "e.g., NVMe SSD, SATA SSD, HDD, USB flash drive"
    validations:
      required: true

  - type: dropdown
    id: boot-result
    attributes:
      label: Boot Result
      description: How far did Impossible OS get?
      options:
        - "Success — desktop loaded"
        - "Partial — kernel booted but no desktop"
        - "Fail — kernel panic or hang"
        - "No display — black screen after bootloader"
    validations:
      required: true

  - type: textarea
    id: boot-log
    attributes:
      label: Boot Log
      description: If available, paste the serial output or a photo of the screen.
      render: text
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any other observations (BIOS settings, Secure Boot status, USB boot method, etc.)
    validations:
      required: false
