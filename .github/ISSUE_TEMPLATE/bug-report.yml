name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Impossible OS
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the fields below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Boot the OS in QEMU with...
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Test Environment
      description: Where did you observe this bug?
      options:
        - QEMU
        - VirtualBox
        - Hyper-V
        - VMware
        - Real Hardware
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the OS is affected?
      options:
        - Kernel
        - Bootloader
        - Desktop / Window Manager
        - Drivers
        - Filesystem
        - Networking
        - Userland / Shell
        - Build System
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: serial-log
    attributes:
      label: Serial Output / Boot Log
      description: Paste any relevant serial output or boot log here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: If applicable, attach a screenshot or photo of the issue.
    validations:
      required: false
