# ──────────────────────────────────────────────────────────────────────────────
# Impossible OS — Stale Issue & PR Cleanup
#
# Automatically labels and closes inactive issues and pull requests.
# - 60 days of inactivity → labeled "stale"
# - 14 more days without response → auto-closed with comment
# ──────────────────────────────────────────────────────────────────────────────

name: Stale Issues

on:
  schedule:
    - cron: '30 1 * * *'  # Daily at 01:30 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close Stale Issues & PRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v9
        with:
          # Issue settings
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days.
            It will be closed in 14 days unless there is new activity.
          close-issue-message: >
            This issue has been closed due to inactivity.
            If this is still relevant, please reopen it or create a new issue.

          # PR settings
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been inactive for 60 days.
            It will be closed in 14 days unless there is new activity.
          close-pr-message: >
            This pull request has been closed due to inactivity.
            If this is still relevant, please reopen it.

          # Exempt labels — never mark these as stale
          exempt-issue-labels: pinned,security,help-wanted
          exempt-pr-labels: pinned,security,help-wanted

          # Process up to 30 issues per run to stay within API limits
          operations-per-run: 30
