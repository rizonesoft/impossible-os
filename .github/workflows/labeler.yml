# ──────────────────────────────────────────────────────────────────────────────
# Impossible OS — Auto-Label PRs by Path
#
# Automatically applies labels to pull requests based on which files changed.
# Label definitions are in .github/labeler.yml.
# ──────────────────────────────────────────────────────────────────────────────

name: Label PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-Label PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
