# ──────────────────────────────────────────────────────────────────────────────
# Impossible OS — Build & Smoke Test
#
# Runs on every push to main and on pull requests.
# Builds the full OS disk image using the project's build.sh wrapper.
# Normal CI does NOT upload the disk image; a manual workflow_dispatch can opt in
# when someone explicitly needs the exact built image for debugging.
# ──────────────────────────────────────────────────────────────────────────────

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_disk_image:
        description: 'Upload build/system-disk.img as a CI artifact'
        required: false
        default: false
        type: boolean

# Cancel in-progress builds when a newer push arrives
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_VERSION: "19"

jobs:
  build:
    name: Build Impossible OS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for build_info.h commit hash

      # ── Cache LLVM toolchain ────────────────────────────────────────────────
      # The LLVM apt install takes ~30s; caching the installed binaries
      # shaves this off on subsequent runs. Cache paths must cover every
      # binary the 14-sentinel setup.sh --verify contract looks for.
      - name: Cache LLVM toolchain
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /usr/bin/clang-${{ env.LLVM_VERSION }}
            /usr/bin/ld.lld-${{ env.LLVM_VERSION }}
            /usr/bin/llvm-objcopy-${{ env.LLVM_VERSION }}
            /usr/bin/llvm-ar-${{ env.LLVM_VERSION }}
            /usr/bin/llvm-nm-${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}-v2

      # ── Install LLVM (clang-19, lld-19, llvm-19) ────────────────────────────
      # llvm-${VERSION} owns llvm-ar-${VERSION} / llvm-nm-${VERSION} /
      # llvm-objcopy-${VERSION}; install it explicitly so setup.sh --verify
      # does not rely on apt Recommends auto-pulling it.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ env.LLVM_VERSION }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }}

      # ── Install build dependencies ──────────────────────────────────────────
      # LLVM is installed above with caching; this step brings in the rest of
      # the sentinel set that scripts/setup.sh declares.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm \
            mtools \
            dosfstools \
            ovmf \
            qemu-system-x86 \
            gcc \
            python3-yaml

      # ── Verify toolchain matches scripts/setup.sh sentinel contract ─────────
      # If this fails, the inline apt install above and scripts/setup.sh have
      # drifted. Fix whichever side is out of sync -- do NOT mask with `|| true`.
      - name: Verify toolchain sentinels
        run: bash scripts/setup.sh --verify

      # ── Style lint (cheap, no build required) ─────────────────────────────
      # Enforces include-guards, 120-char line length, trailing whitespace,
      # snake_case function names, and -- most important for drift -- no
      # numeric-TODO shorthand (TODO-NN sectionN, DNN TNN) outside todo/**.
      # The legacy-XREF sweep drained the pre-existing allowlist, so any new
      # drift is now a CI failure instead of a silent warning.
      - name: Run style lint
        run: bash scripts/lint.sh

      # ── Host-side tooling regression pack (cheap, no build required) ───────
      # Exercises the wrapper contract, hook lifecycle, and workflow YAML
      # without actually compiling the OS. Catches drift between local docs
      # and CI before the build stage runs.
      - name: Run tooling regression pack
        run: bash scripts/test-tooling.sh --quiet

      # AI workflow regression pack (AI Development System roadmap). Checks doctrine presence,
      # Authority Hierarchy integrity, AGENTS.md file contract, zero-trailer
      # commit policy, autonomous-agent boundary, skill catalog sync,
      # index-link integrity, and related surfaces. Runs before the build so
      # AI-workflow drift is caught at PR time rather than after the user
      # notices a broken invariant.
      - name: Run AI workflow regression pack
        run: bash scripts/test-ai-system.sh --quiet

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build OS (clean)
        run: bash scripts/build.sh clean

      # ── Verify build success ────────────────────────────────────────────────
      - name: Verify build sentinel
        run: |
          LAST_LINE=$(tail -1 build/build.log)
          echo "Build log last line: $LAST_LINE"
          if [ "$LAST_LINE" != "=== BUILD OK ===" ]; then
            echo "::error::Build did not complete successfully"
            echo "--- Last 30 lines of build.log ---"
            tail -30 build/build.log
            exit 1
          fi
          echo "✅ Build succeeded"

      # ── Verify disk image exists ────────────────────────────────────────────
      - name: Verify disk image
        run: |
          if [ ! -f build/system-disk.img ]; then
            echo "::error::build/system-disk.img not found"
            exit 1
          fi
          SIZE=$(stat -c%s build/system-disk.img)
          echo "✅ system-disk.img: $(( SIZE / 1024 / 1024 )) MiB"

      # ── boot_info ABI drift-detection regression ───────────────────────────
      # Mutates the mirror header into known-broken fixtures and verifies
      # tools/boot-info-manifest/compare.sh names the expected first-mismatch
      # field. Depends on build/boot-info-abi.kernel.json emitted by the
      # Build step above. Guards against a future compare.sh regression
      # silently letting real ABI drift ship.
      - name: Run boot_info ABI drift tests
        run: make test-boot-info-abi

      # ── Unit tests ──────────────────────────────────────────────────────────
      # GHA ubuntu-latest does not expose /dev/kvm reliably -- test.sh falls
      # back to TCG. Job-level timeout-minutes caps runaway runs. Serial
      # output goes to build/test.log, uploaded on failure below.
      - name: Run unit tests
        run: bash scripts/test.sh QUIET=1

      # ── Optional disk-image artifact (manual runs only) ────────────────────
      # The raw disk image is by far the largest CI artifact and quickly burns
      # through GitHub's shared artifact quota. Keep normal push/PR runs
      # artifact-free; when someone truly needs the exact built image, use
      # workflow_dispatch with upload_disk_image=true.
      - name: Upload disk image (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_disk_image
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: system-disk
          path: build/system-disk.img
          retention-days: 1
          if-no-files-found: error

      # Logs are small and useful for diagnosis, but only on failures.
      # retention-days kept at 1 so the shared GitHub Actions artifact
      # quota recovers fast -- hit the cap on 2026-04-22 which stalled
      # this step with "Artifact storage quota has been hit". The job
      # already tolerates this failure via continue-on-error, but a
      # shorter retention keeps the cap from biting again.
      - name: Upload build + test logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/build.log
            build/test.log
          retention-days: 1
          if-no-files-found: ignore
