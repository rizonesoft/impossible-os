name: Deploy GitHub Pages

# The published site is GENERATED, never committed: scripts/site/build.py
# renders the landing templates in gh-pages/ (with project.json facts) and every
# docs/**/*.md page into build/site/. The --check pass runs first so a drifted
# source (dead doc link, stale project region, stale coverage baseline) fails
# the deploy instead of publishing.

on:
  push:
    branches: [main]
    paths:
      - 'gh-pages/**'
      - 'docs/**'
      - 'todo/**'
      - 'project.json'
      - 'COUNT.md'
      - 'README.md'
      - 'scripts/site/**'
      - 'tools/vendor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Node 20 runtime removed from runners 2026-09-16; opt in to Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check published sources for drift
        run: python3 scripts/site/build.py --check

      - name: Build site
        run: python3 scripts/site/build.py --out _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
