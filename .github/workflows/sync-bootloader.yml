name: Sync Bootloader to Public Repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/boot/**'

jobs:
  sync-bootloader:
    name: Push src/boot/ to impossible-os-bootloader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split src/boot/ into a synthetic branch
        run: |
          git subtree split --prefix=src/boot/ -b bootloader-split

      - name: Push split branch to public bootloader repo
        run: |
          git remote add public https://x-access-token:${{ secrets.BOOTLOADER_REPO_TOKEN }}@github.com/rizonesoft/impossible-os-bootloader.git
          git push public bootloader-split:main --force

      - name: Cleanup split branch
        run: |
          git branch -D bootloader-split
