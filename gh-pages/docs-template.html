<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>%TITLE% · {{name}} Docs</title>
<meta name="description" content="%DESCRIPTION%">
<link rel="canonical" href="%CANONICAL%">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="%TITLE%">
<meta property="og:description" content="%DESCRIPTION%">
<meta property="og:url" content="%CANONICAL%">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="%SITE_ROOT%icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('ios-docs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #0a0e1a; --bg-2: #111827; --card: #151b2e; --card-2: #1a2138;
  --text: #eef2ff; --text-2: #a3b1c6; --muted: #6b7a90;
  --accent: #2eb5f0; --accent-2: #155cde; --accent-3: #40daf2;
  --border: rgba(148,163,184,.14); --glass: rgba(10,14,26,.72);
  --code-bg: #0d1322; --shadow: 0 10px 30px rgba(0,0,0,.35);
  --note: #2eb5f0; --tip: #34d399; --important: #a78bfa; --warning: #fbbf24; --caution: #f87171;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fc; --bg-2: #ffffff; --card: #ffffff; --card-2: #eef2f8;
    --text: #0f172a; --text-2: #334155; --muted: #64748b;
    --accent: #0a6ccf; --accent-2: #155cde; --accent-3: #0891b2;
    --border: rgba(15,23,42,.12); --glass: rgba(246,248,252,.78);
    --code-bg: #f1f5f9; --shadow: 0 10px 30px rgba(15,23,42,.08);
  }
}
:root[data-theme="light"] {
  --bg: #f6f8fc; --bg-2: #ffffff; --card: #ffffff; --card-2: #eef2f8;
  --text: #0f172a; --text-2: #334155; --muted: #64748b;
  --accent: #0a6ccf; --accent-2: #155cde; --accent-3: #0891b2;
  --border: rgba(15,23,42,.12); --glass: rgba(246,248,252,.78);
  --code-bg: #f1f5f9; --shadow: 0 10px 30px rgba(15,23,42,.08);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.7 Inter, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header.top { position: sticky; top: 0; z-index: 20; height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font: 700 1.02rem "Plus Jakarta Sans", Inter, sans-serif; letter-spacing: .4px; white-space: nowrap; }
.brand img { width: 30px; height: 30px; }
.brand small { color: var(--muted); font-weight: 600; }
.search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); }
.results { position: absolute; top: 44px; left: 0; right: 0; max-height: 60vh; overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: none; }
.results [role=option] { display: block; padding: 10px 14px; color: var(--text); border-bottom: 1px solid var(--border); }
.results [role=option]:hover, .results [aria-selected=true] { background: var(--card-2); text-decoration: none; }
.results [aria-selected=true] { outline: 2px solid var(--accent); outline-offset: -2px; }
.results .sec { display: block; color: var(--text-2); font-size: 13px; }
.results small { display: block; color: var(--muted); font-size: 12.5px; }
.results-msg { margin: 0; padding: 10px 14px; color: var(--muted); font-size: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.top-links { display: flex; gap: 16px; align-items: center; font-size: 14px; }
.top-links a { color: var(--text-2); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
.menu-btn { display: none; }
.version { height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; }
.version:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 220px; max-width: 1480px; margin: 0 auto; }
aside.side { position: sticky; top: 64px; height: calc(100vh - 64px); overflow: auto; padding: 22px 14px 40px 20px; border-right: 1px solid var(--border); font-size: 14px; }
aside.side ul { list-style: none; margin: 0; padding: 0 0 0 10px; }
aside.side > ul { padding-left: 0; }
aside.side li { margin: 1px 0; }
aside.side a { display: block; padding: 4px 10px; border-radius: 8px; color: var(--text-2); }
aside.side a:hover { background: var(--card-2); text-decoration: none; color: var(--text); }
aside.side a.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); font-weight: 600; }
aside.side summary { cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--text); font-weight: 600; list-style: none; display: flex; align-items: center; gap: 4px; }
aside.side summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
aside.side details[open] > summary::before { transform: rotate(90deg); }
aside.side summary a { padding: 0; color: inherit; }
aside.side summary a:hover { background: none; }
main { min-width: 0; padding: 36px 48px 80px; }
article { max-width: 860px; }
article h1 { font: 800 2.2rem/1.2 "Plus Jakarta Sans", Inter, sans-serif; margin: 0 0 18px; letter-spacing: -.3px; }
article h2 { font: 700 1.45rem/1.3 "Plus Jakarta Sans", Inter, sans-serif; margin: 2.2em 0 .7em; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
article h3 { font: 700 1.15rem/1.4 "Plus Jakarta Sans", Inter, sans-serif; margin: 1.8em 0 .5em; }
article h4 { margin: 1.5em 0 .4em; }
article p, article ul, article ol { margin: .7em 0; }
article li { margin: .2em 0; }
article li.task { list-style: none; margin-left: -1.3em; }
article img { max-width: 100%; }
article hr { border: 0; border-top: 1px solid var(--border); margin: 2.4em 0; }
code { font: 13.5px/1.5 "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; background: var(--code-bg); border: 1px solid var(--border); padding: .1em .38em; border-radius: 6px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; overflow: auto; }
pre code { background: none; border: 0; padding: 0; }
pre.mermaid { background: var(--card); text-align: center; }
.table-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--border); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--card-2); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
blockquote { margin: 1em 0; padding: 10px 16px; border-left: 3px solid var(--border); background: var(--card); border-radius: 0 10px 10px 0; color: var(--text-2); }
blockquote.alert { border-left-color: var(--note); }
blockquote .alert-title { margin: 0 0 2px; font-weight: 700; color: var(--note); }
blockquote.alert-tip { border-left-color: var(--tip); } blockquote.alert-tip .alert-title { color: var(--tip); }
blockquote.alert-important { border-left-color: var(--important); } blockquote.alert-important .alert-title { color: var(--important); }
blockquote.alert-warning { border-left-color: var(--warning); } blockquote.alert-warning .alert-title { color: var(--warning); }
blockquote.alert-caution { border-left-color: var(--caution); } blockquote.alert-caution .alert-title { color: var(--caution); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--card-2); color: var(--text-2); vertical-align: middle; }
.missing { color: var(--muted); font-style: italic; }
.meter { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.page-foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
nav.toc { position: sticky; top: 64px; max-height: calc(100vh - 64px); overflow: auto; padding: 36px 16px 40px; font-size: 13px; }
nav.toc p { margin: 0 0 8px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .6px; font-size: 11.5px; }
nav.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
nav.toc li a { display: block; padding: 3px 12px; color: var(--muted); }
nav.toc li.l3 a { padding-left: 24px; }
nav.toc li a:hover { color: var(--text); text-decoration: none; }
@media (max-width: 1180px) { .layout { grid-template-columns: 260px minmax(0, 1fr); } .toc-col { display: none; } }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: fixed; z-index: 15; left: 0; top: 64px; width: 86vw; max-width: 320px; background: var(--bg-2); transform: translateX(-100%); transition: transform .2s; }
  body.nav-open aside.side { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: grid; }
  main { padding: 24px 16px 60px; }
  .top-links .hide-sm, .brand small { display: none; }
  article h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" aria-label="Toggle navigation" onclick="document.body.classList.toggle('nav-open')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="%ROOT%"><img src="%SITE_ROOT%logo.svg" alt=""> {{name}} <small>Docs</small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results"
      placeholder="Search the docs" autocomplete="off" aria-label="Search the docs" data-search-index="2">
    <div class="results" id="results-pop">
      <div role="listbox" id="results" aria-label="Search results"></div>
      <p class="results-msg" id="results-msg" aria-hidden="true" hidden></p>
    </div>
    <p class="sr-only" id="search-status" role="status" aria-live="polite"></p>
  </div>
  <div class="top-links">
    <a class="hide-sm" href="%SITE_ROOT%">Home</a>
    <a class="hide-sm" href="%ROOT%coverage.html">Coverage</a>
    <a class="hide-sm" href="{{repo_url}}">GitHub</a>
    <select class="version" id="version" aria-label="Documentation version" data-version="%DOCS_VERSION%" data-page="%PAGE_PATH%" hidden></select>
    <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>
<div class="layout">
  <aside class="side">%NAV%</aside>
  <main>
    <article>
%BODY%
    </article>
    <div class="page-foot">
      <span>{{name}} is free software under the {{license}} license.</span>
      %UPDATED%
      <a href="%EDIT%">Edit this page on GitHub</a>
    </div>
  </main>
  <div class="toc-col">%TOC%</div>
</div>
<script>
(function () {
  var root = '%ROOT%';
  var btn = document.getElementById('theme');
  btn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('ios-docs-theme', next); } catch (e) {}
  });
  // Search: an ARIA 1.2 combobox over a listbox (W3C APG "list autocomplete").
  // The index is a manifest (search.json) plus content-addressed shards holding
  // the full text of every section; see search_files() in scripts/site/build.py.
  var q = document.getElementById('q'), pop = document.getElementById('results-pop'),
      list = document.getElementById('results'), msg = document.getElementById('results-msg'),
      status = document.getElementById('search-status');
  var idx = null, loading = null, revalidate = false, refreshTimer = 0, shards = [], gen = 0, open = false, pending = false, sel = -1, opts = [], optPages = [];
  function json(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  // The manifest alone answers title and heading queries, so results show at
  // once; each shard fills in its sections' text as it arrives and the search
  // on screen is scored again.
  function load(retry) {
    // A search the reader types after a shard failed starts over from the
    // manifest, revalidated: shard names are content hashes, so a deploy that
    // replaced them leaves the old manifest naming files that no longer exist,
    // and a transient failure costs one manifest while the loaded shards come
    // back from the browser cache. A refresh after a shard lands never retries,
    // or a lasting failure would loop.
    // A manifest that failed to load or parse is revalidated too: the browser
    // may be holding a cached copy the deploy has since replaced.
    var failed = shards.some(function (sh) { return sh.state === 3; });
    if (idx && retry && failed) { idx = null; shards = []; revalidate = true; }
    if (idx) return Promise.resolve(idx);
    if (!loading) {
      var fresh = revalidate;
      loading = fetch(root + 'search.json', fresh ? { cache: 'no-cache' } : undefined).then(json).then(function (m) {
        if (!m || m.v !== 2 || !Array.isArray(m.p) || !Array.isArray(m.s) || !Array.isArray(m.shards)) {
          throw new Error('unknown index format');
        }
        var at = 0;
        shards = m.shards.map(function (s) { var sh = { name: s[0], count: s[1], at: at, state: 0 }; at += s[1]; return sh; });
        if (at !== m.s.length) throw new Error('index shards do not match the manifest');
        idx = m.s.map(function (r) {
          var p = m.p[r[0]];
          return { pg: r[0], t: p[0], u: p[1], a: r[1], h: r[2], x: '', xl: '',
                   tl: p[0].toLowerCase(), hl: r[2].toLowerCase() };
        });
        fetchShards(idx, shards);
        return idx;
      });
      // A failed load is forgotten, so the next keystroke retries it, revalidated.
      loading.then(function () { loading = null; revalidate = false; },
                   function () { loading = null; revalidate = true; });
    }
    return loading;
  }
  // Shard state: 0 not fetched, 1 fetching, 2 loaded, 3 failed. A shard that
  // lands after its index was replaced is dropped.
  function fetchShards(mine, list) {
    list.forEach(function (sh) {
      sh.state = 1;
      fetch(root + sh.name).then(json).then(function (a) {
        if (!Array.isArray(a) || a.length !== sh.count) throw new Error('shard ' + sh.name + ' does not match the index');
        for (var i = 0; i < a.length; i++) {
          mine[sh.at + i].x = String(a[i]);
          mine[sh.at + i].xl = mine[sh.at + i].x.toLowerCase();
        }
        sh.state = 2;
      }).catch(function () { sh.state = 3; }).then(function () {
        // Shards landing together (a warm cache) are scored once, not once each.
        if (idx === mine && !refreshTimer) {
          refreshTimer = setTimeout(function () {
            refreshTimer = 0;
            if (idx && pop.style.display === 'block' && q.value.trim()) run(true);   // never reopens a dismissed search
          }, 16);
        }
      });
    });
  }
  function progress() {
    var st = 'done';
    shards.forEach(function (sh) {
      if (sh.state < 2) st = 'loading';
      else if (sh.state === 3 && st !== 'loading') st = 'failed';
    });
    return st;
  }
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function say(text) { status.textContent = text; }
  function select(i) {
    sel = i;
    opts.forEach(function (o, j) { o.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    if (i >= 0) {
      q.setAttribute('aria-activedescendant', opts[i].id);
      if (opts[i].scrollIntoView) opts[i].scrollIntoView({ block: 'nearest' });
    } else {
      q.removeAttribute('aria-activedescendant');
    }
  }
  function close() {
    gen++;                                  // a load still in flight may not reopen what was dismissed
    open = pending = false;
    pop.style.display = 'none';
    q.setAttribute('aria-expanded', 'false');
    select(-1);
  }
  function show(html, count, note) {
    list.innerHTML = html;
    opts = Array.prototype.slice.call(list.querySelectorAll('[role=option]'));
    sel = -1;
    select(-1);
    msg.textContent = note;
    msg.hidden = !note;
    list.hidden = !count;
    pop.style.display = 'block';
    open = count > 0;
    q.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function run(again) {
    // A refresh keeps the selection on the same PAGE: a shard can move its best section and so its href.
    var my = ++gen, keep = again === true && sel >= 0 ? optPages[sel] : -1;
    var terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) { close(); say(''); return; }
    pending = true;
    // A typed query's results replace the last one's, so the old ones go at once:
    // none may be chosen by key or pointer while the new ones load. With the index
    // loaded they are back within a microtask, before anything is painted.
    if (again !== true) {
      select(-1);
      list.innerHTML = '';
      list.hidden = true;
      opts = []; optPages = []; open = false;
      q.setAttribute('aria-expanded', 'false');
    }
    load(again !== true).then(function (records) {
      if (my !== gen) return;
      pending = false;
      var best = {};
      records.forEach(function (r) {
        var s = 0;
        for (var i = 0; i < terms.length; i++) {
          var w = terms[i], k = 0;
          if (r.tl.indexOf(w) >= 0) k += 10;
          if (r.hl.indexOf(w) >= 0) k += 4;
          if (r.xl.indexOf(w) >= 0) k += 1;
          if (!k) return;
          s += k;
        }
        if (!best[r.pg] || s > best[r.pg][0]) best[r.pg] = [s, r];
      });
      var hits = Object.keys(best).map(function (k) { return best[k]; });
      hits.sort(function (a, b) { return b[0] - a[0] || a[1].pg - b[1].pg; });
      var total = hits.length;
      hits = hits.slice(0, 12);
      var html = hits.map(function (hp, n) {
        var r = hp[1], j = -1;
        for (var i = 0; i < terms.length && j < 0; i++) j = r.xl.indexOf(terms[i]);
        var snip = j >= 0 ? (j > 50 ? '\u2026' : '') + r.x.slice(Math.max(0, j - 50), j + 90) : r.x.slice(0, 120);
        return '<a role="option" id="search-opt-' + n + '" tabindex="-1" aria-selected="false" href="' +
          esc(root + r.u + (r.a ? '#' + r.a : '')) + '">' + esc(r.t) +
          (r.h ? '<span class="sec">' + esc(r.h) + '</span>' : '') + '<small>' + esc(snip) + '</small></a>';
      }).join('');
      var st = progress();
      show(html, hits.length, st === 'loading' ? 'Searching the full text\u2026' :
           st === 'failed' ? 'Part of the search index did not load. Type again to retry.' : hits.length ? '' : 'No results');
      optPages = hits.map(function (hp) { return hp[1].pg; });
      if (keep >= 0 && optPages.indexOf(keep) >= 0) select(optPages.indexOf(keep));
      // Announced once per search, not again for every shard that arrives.
      if (again !== true || st !== 'loading') {
        say((total ? (total > hits.length ? 'Showing ' + hits.length + ' of ' + total + ' results' :
                      total + (total === 1 ? ' result' : ' results')) + ', use the arrow keys to choose one' : 'No results') +
            (st === 'loading' ? ', still searching the full text' :
             st === 'failed' ? '. Part of the search index did not load; type again to retry' : ''));
      }
    }, function () {
      if (my !== gen) return;
      pending = false;
      show('', 0, 'Search is unavailable right now. Type again to retry.');
      say('Search is unavailable right now. Type again to retry.');
    });
  }
  q.addEventListener('input', run);
  q.addEventListener('focus', function () { if (q.value.trim() && !open) run(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open || !opts.length) { if (!pending && q.value.trim()) run(); return; }
      var down = e.key === 'ArrowDown';
      select(sel < 0 ? (down ? 0 : opts.length - 1) : Math.max(0, Math.min(opts.length - 1, sel + (down ? 1 : -1))));
    } else if (e.key === 'Enter') {
      // A section on this page only changes the fragment, so close before going.
      if (open && sel >= 0) { e.preventDefault(); var go = opts[sel].getAttribute('href'); close(); location.href = go; }
    } else if (e.key === 'Escape') {
      // APG: Escape collapses an open popup (or cancels one still loading) and
      // keeps the text; with nothing open it clears the text.
      var visible = pop.style.display === 'block' || pending;
      e.preventDefault();
      close();
      if (!visible && q.value) { q.value = ''; say(''); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); q.focus();
    }
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) close(); });
  list.addEventListener('click', function (e) { if (e.target.closest('[role=option]')) close(); });
  q.addEventListener('blur', function (e) {
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.search')) close();
  });
  // Version picker. docs/versions.json lists main and every retained release
  // (scripts/site/releases.py); it stays hidden until there is a second version.
  // Switching keeps the reader on the same page when the other version has it.
  var vsel = document.getElementById('version');
  if (vsel && typeof fetch === 'function') {
    var docsRoot = '%SITE_ROOT%docs/';
    fetch(docsRoot + 'versions.json').then(json).then(function (m) {
      var vs = (m && m.versions || []).filter(function (v) {
        return v && typeof v.name === 'string' && /^(v[A-Za-z0-9._-]*\/)?$/.test(v.path);
      });
      if (vs.length < 2) return;
      vs.forEach(function (v) {
        var o = document.createElement('option');
        o.value = v.path;
        o.textContent = v.name;
        o.selected = v.name === vsel.dataset.version;
        vsel.appendChild(o);
      });
      vsel.hidden = false;
      var picked = 0;   // only the latest choice navigates, however its probe and earlier ones resolve
      vsel.addEventListener('change', function () {
        var mine = ++picked, base = docsRoot + vsel.value, target = base + vsel.dataset.page;
        function go(url) { if (mine === picked) location.href = url; }
        fetch(target, { method: 'HEAD' }).then(function (r) { go(r.ok ? target : base); },
                                               function () { go(base); });
      });
    }).catch(function () {});
  }
  if (document.querySelector('pre.mermaid')) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    s.onload = function () {
      var dark = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'dark';
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
      mermaid.run({ querySelector: 'pre.mermaid' });
    };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
