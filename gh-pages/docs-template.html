<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>%TITLE% · {{name}} Docs</title>
<meta name="description" content="%DESCRIPTION%">
%ROBOTS%<link rel="canonical" href="%CANONICAL%">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="%TITLE%">
<meta property="og:description" content="%DESCRIPTION%">
<meta property="og:url" content="%CANONICAL%">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="%SITE_ROOT%icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('ios-docs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #0a0e1a; --bg-2: #111827; --card: #151b2e; --card-2: #1a2138;
  --text: #eef2ff; --text-2: #a3b1c6; --muted: #7d8ca3;
  --accent: #2eb5f0; --accent-2: #155cde; --accent-3: #40daf2;
  --border: rgba(148,163,184,.14); --glass: rgba(10,14,26,.72);
  --code-bg: #0d1322; --shadow: 0 10px 30px rgba(0,0,0,.35);
  --note: #2eb5f0; --tip: #34d399; --important: #a78bfa; --warning: #fbbf24; --caution: #f87171;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fc; --bg-2: #ffffff; --card: #ffffff; --card-2: #eef2f8;
    --text: #0f172a; --text-2: #334155; --muted: #5b6b80;
    --accent: #0a6ccf; --accent-2: #155cde; --accent-3: #0891b2;
    --border: rgba(15,23,42,.12); --glass: rgba(246,248,252,.78);
    --code-bg: #f1f5f9; --shadow: 0 10px 30px rgba(15,23,42,.08);
    --note: #0369a1; --tip: #047857; --important: #6d28d9; --warning: #b45309; --caution: #b91c1c;
  }
}
:root[data-theme="light"] {
  --bg: #f6f8fc; --bg-2: #ffffff; --card: #ffffff; --card-2: #eef2f8;
  --text: #0f172a; --text-2: #334155; --muted: #5b6b80;
  --accent: #0a6ccf; --accent-2: #155cde; --accent-3: #0891b2;
  --border: rgba(15,23,42,.12); --glass: rgba(246,248,252,.78);
  --code-bg: #f1f5f9; --shadow: 0 10px 30px rgba(15,23,42,.08);
  --note: #0369a1; --tip: #047857; --important: #6d28d9; --warning: #b45309; --caution: #b91c1c;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.7 Inter, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
/* A link inside running text is underlined: colour alone does not mark it (WCAG 1.4.1). */
article :is(p, li, td, blockquote) a { text-decoration: underline; text-underline-offset: 2px; }
header.top { position: sticky; top: 0; z-index: 20; height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font: 700 1.02rem "Plus Jakarta Sans", Inter, sans-serif; letter-spacing: .4px; white-space: nowrap; }
.brand img { width: 30px; height: 30px; }
.brand small { color: var(--muted); font-weight: 600; }
.search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.search input { width: 100%; height: 38px; padding: 0 36px 0 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--muted); }
.key-hint { position: absolute; right: 9px; top: 9px; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--card-2);
  color: var(--text-2); font: 12px/18px "JetBrains Mono", ui-monospace, monospace; text-align: center; pointer-events: none; }
.search input:focus ~ .key-hint, .search input:not(:placeholder-shown) ~ .key-hint { display: none; }
.results { position: absolute; top: 44px; left: 0; right: 0; overflow: hidden; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: none; }
/* The listbox itself scrolls: arrow keys move through it from the search box (aria-activedescendant). */
.results [role=listbox] { max-height: 60vh; overflow: auto; }
.results [role=option] { display: block; padding: 10px 14px; color: var(--text); border-bottom: 1px solid var(--border); }
.results [role=option]:hover, .results [aria-selected=true] { background: var(--card-2); text-decoration: none; }
.results [aria-selected=true] { outline: 2px solid var(--accent); outline-offset: -2px; }
.results .sec { display: block; color: var(--text-2); font-size: 13px; }
.results small { display: block; color: var(--muted); font-size: 12.5px; }
.results-msg { margin: 0; padding: 10px 14px; color: var(--muted); font-size: 14px; }
mark { background: #fde68a; color: #0f172a; border-radius: 3px; padding: 0 .1em; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 30; padding: 8px 14px; border-radius: 10px; background: #155cde; color: #fff; font-weight: 600; }
.skip-link:focus { top: 12px; }
a:focus-visible, button:focus-visible, summary:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus:not(:focus-visible) { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.top-links { display: flex; gap: 16px; align-items: center; font-size: 14px; }
.top-links a { color: var(--text-2); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
.menu-btn { display: none; }
.version { height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer; }
.version:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.version-note { max-width: 860px; margin: 0 0 22px; padding: 10px 14px; border-left: 3px solid var(--warning); border-radius: 0 10px 10px 0; background: var(--card); color: var(--text-2); font-size: 14px; }
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 220px; max-width: 1480px; margin: 0 auto; }
nav.side { position: sticky; top: 64px; height: calc(100vh - 64px); overflow: auto; padding: 22px 14px 40px 20px; border-right: 1px solid var(--border); font-size: 14px; }
nav.side ul { list-style: none; margin: 0; padding: 0 0 0 10px; }
nav.side > ul { padding-left: 0; }
nav.side li { margin: 1px 0; }
nav.side a { display: block; padding: 4px 10px; border-radius: 8px; color: var(--text-2); }
nav.side a:hover { background: var(--card-2); text-decoration: none; color: var(--text); }
nav.side a.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); font-weight: 600; }
nav.side summary { cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--text); font-weight: 600; list-style: none; display: flex; align-items: center; gap: 4px; }
nav.side summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
nav.side details[open] > summary::before { transform: rotate(90deg); }
nav.side summary a { padding: 0; color: inherit; }
nav.side summary a:hover { background: none; }
main { min-width: 0; padding: 36px 48px 80px; }
article { max-width: 860px; }
article h1 { font: 800 2.2rem/1.2 "Plus Jakarta Sans", Inter, sans-serif; margin: 0 0 18px; letter-spacing: -.3px; }
article h2 { font: 700 1.45rem/1.3 "Plus Jakarta Sans", Inter, sans-serif; margin: 2.2em 0 .7em; padding-bottom: .35em; border-bottom: 1px solid var(--border); }
article h3 { font: 700 1.15rem/1.4 "Plus Jakarta Sans", Inter, sans-serif; margin: 1.8em 0 .5em; }
article h4 { margin: 1.5em 0 .4em; }
article p, article ul, article ol { margin: .7em 0; }
article li { margin: .2em 0; }
article li.task { list-style: none; margin-left: -1.3em; }
article img { max-width: 100%; }
article hr { border: 0; border-top: 1px solid var(--border); margin: 2.4em 0; }
code { font: 13.5px/1.5 "JetBrains Mono", ui-monospace, monospace; font-variant-ligatures: none; background: var(--code-bg); border: 1px solid var(--border); padding: .1em .38em; border-radius: 6px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; overflow: auto; }
pre code { background: none; border: 0; padding: 0; }
pre.mermaid { background: var(--card); text-align: center; }
.table-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--border); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { background: var(--card-2); font-weight: 600; }
td a { overflow-wrap: anywhere; }
tr:last-child td { border-bottom: 0; }
blockquote { margin: 1em 0; padding: 10px 16px; border-left: 3px solid var(--border); background: var(--card); border-radius: 0 10px 10px 0; color: var(--text-2); }
blockquote.alert { border-left-color: var(--note); }
blockquote .alert-title { margin: 0 0 2px; font-weight: 700; color: var(--note); }
blockquote.alert-tip { border-left-color: var(--tip); } blockquote.alert-tip .alert-title { color: var(--tip); }
blockquote.alert-important { border-left-color: var(--important); } blockquote.alert-important .alert-title { color: var(--important); }
blockquote.alert-warning { border-left-color: var(--warning); } blockquote.alert-warning .alert-title { color: var(--warning); }
blockquote.alert-caution { border-left-color: var(--caution); } blockquote.alert-caution .alert-title { color: var(--caution); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--card-2); color: var(--text-2); vertical-align: middle; }
.missing { color: var(--muted); font-style: italic; }
.meter { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.page-foot { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
nav.toc { position: sticky; top: 64px; max-height: calc(100vh - 64px); overflow: auto; padding: 36px 16px 40px; font-size: 13px; }
nav.toc p { margin: 0 0 8px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .6px; font-size: 11.5px; }
nav.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
nav.toc li a { display: block; padding: 3px 12px; color: var(--muted); }
nav.toc li.l3 a { padding-left: 24px; }
nav.toc li a:hover { color: var(--text); text-decoration: none; }
@media (max-width: 1180px) { .layout { grid-template-columns: 260px minmax(0, 1fr); } .toc-col { display: none; } }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.side { position: fixed; z-index: 15; left: 0; top: 64px; width: 86vw; max-width: 320px; background: var(--bg-2); transform: translateX(-100%); transition: transform .2s; }
  .results { position: fixed; top: 64px; left: 8px; right: 8px; }
  .results [role=listbox] { max-height: calc(100vh - 130px); }
  body.nav-open nav.side { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: grid; }
  main { padding: 24px 16px 60px; }
  .top-links .hide-sm, .brand small { display: none; }
  article h1 { font-size: 1.8rem; }
}
@media (max-width: 480px) {
  .brand .name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .key-hint { display: none; }
  .search input { padding-right: 12px; }
}
.hits { list-style: none; margin: 1em 0; padding: 0; }
.hits > li { margin: 0 0 22px; }
.hits h2 { margin: 0 0 4px; padding: 0; border: 0; font-size: 1.15rem; }
.hits ul { margin: 0; padding-left: 18px; }
.hits p { margin: 2px 0 10px; color: var(--text-2); font-size: 14px; }
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="top">
  <button class="icon-btn menu-btn" id="menu" aria-label="Toggle navigation" aria-controls="side" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="%ROOT%"><img src="%SITE_ROOT%logo.svg" alt=""> <span class="name">{{name}}</span> <small>Docs</small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results"
      placeholder="Search the docs" autocomplete="off" aria-label="Search the docs" aria-keyshortcuts="/"
      data-search-index="2" data-search-page="search.html">
    <kbd class="key-hint" aria-hidden="true">/</kbd>
    <div class="results" id="results-pop">
      <div role="listbox" id="results" aria-label="Search results"></div>
      <p class="results-msg" id="results-msg" aria-hidden="true" hidden></p>
    </div>
    <p class="sr-only" id="search-status" role="status" aria-live="polite"></p>
  </div>
  <div class="top-links">
    <a class="hide-sm" href="%SITE_ROOT%">Home</a>
    <a class="hide-sm" href="%ROOT%coverage.html">Coverage</a>
    <a class="hide-sm" href="{{repo_url}}">GitHub</a>
    <select class="version" id="version" aria-label="Documentation version" data-version="%DOCS_VERSION%" data-page="%PAGE_PATH%" hidden></select>
    <button class="icon-btn" id="theme" aria-label="Toggle light or dark theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="Documentation">%NAV%</nav>
  <main id="content" tabindex="-1">
    <p class="version-note" id="version-note" role="note" hidden></p>
    <article>
%BODY%
    </article>
    <div class="page-foot">
      <span>{{name}} is free software under the {{license}} license.</span>
      %UPDATED%
      <a href="%EDIT%">Edit this page on GitHub</a>
    </div>
  </main>
  <div class="toc-col">%TOC%</div>
</div>
<script>
(function () {
  var root = '%ROOT%';
  var btn = document.getElementById('theme');
  btn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('ios-docs-theme', next); } catch (e) {}
  });
  // Navigation drawer: below 820px the sidebar is off-screen until opened, and
  // while it is closed it is inert, so Tab never lands on a link nobody can see.
  var side = document.getElementById('side'), menu = document.getElementById('menu');
  var narrow = typeof matchMedia === 'function' ? matchMedia('(max-width: 820px)') : null;
  function syncNav() {
    var shown = document.body.classList.contains('nav-open');
    if (menu) menu.setAttribute('aria-expanded', shown ? 'true' : 'false');
    var hide = !!(narrow && narrow.matches && !shown);
    // Focus inside a drawer about to become inert (say the window narrowed under
    // it) goes to the menu button, never to nowhere.
    if (side && hide && menu && side.contains(document.activeElement)) menu.focus();
    if (side) side.inert = hide;
  }
  function closeNav(refocus) {
    if (!document.body.classList.contains('nav-open')) return;
    document.body.classList.remove('nav-open');
    syncNav();
    if (refocus) menu.focus();
  }
  if (menu && side) {
    // Opening the drawer moves focus into it (its first link), so Tab walks the
    // navigation next rather than the header behind it.
    menu.addEventListener('click', function () {
      document.body.classList.toggle('nav-open');
      syncNav();
      var first = document.body.classList.contains('nav-open') && narrow && narrow.matches &&
                  side.querySelector('a[href], summary');
      if (first) first.focus();
    });
    // Leaving the phone width closes the drawer, so it never reappears over the page later.
    if (narrow && narrow.addEventListener) narrow.addEventListener('change', function () {
      if (!narrow.matches) document.body.classList.remove('nav-open');
      syncNav();
    });
    // The open drawer covers the page, so it closes when focus lands outside both
    // the drawer and its menu button (the page's links, or the skip link's target,
    // would otherwise be focused out of sight), and on Escape.
    document.addEventListener('focusin', function (e) {
      var to = e.target;
      if (narrow && narrow.matches && to && to !== menu && !side.contains(to)) closeNav(false);
    });
    document.addEventListener('keydown', function (e) {
      // The search box's own Escape (it prevents the default) is left to the search box.
      if (e.key === 'Escape' && !e.defaultPrevented && document.body.classList.contains('nav-open')) closeNav(true);
    });
    syncNav();
  }
  // Search: an ARIA 1.2 combobox over a listbox (W3C APG "list autocomplete").
  // The index is a manifest (search.json) plus content-addressed shards holding
  // the full text of every section; see search_files() in scripts/site/build.py.
  var q = document.getElementById('q'), pop = document.getElementById('results-pop'),
      list = document.getElementById('results'), msg = document.getElementById('results-msg'),
      status = document.getElementById('search-status'), hitsEl = document.getElementById('search-page'),
      allPage = q.getAttribute('data-search-page');
  var current = '', idx = null, loading = null, revalidate = false, refreshTimer = 0, shards = [], gen = 0, open = false, pending = false, sel = -1, opts = [], optPages = [];
  var SHOWN = 12;
  function json(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
  // Every index request (manifest and shards) must answer, body and all, within
  // DEADLINE or it is aborted and fails: a stalled request can never hold search
  // on "Searching" for good, and one that answers late is ignored. `inflight`
  // holds the live requests of the current index, aborted when it is replaced.
  var DEADLINE = 15000, inflight = [];
  function fetchJson(url, opts) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null, o = {};
    if (opts && opts.cache) o.cache = opts.cache;
    if (ctl) { o.signal = ctl.signal; inflight.push(ctl); }
    return new Promise(function (ok, fail) {
      var timer = setTimeout(function () { if (ctl) ctl.abort(); fail(new Error('timed out: ' + url)); }, DEADLINE);
      function done() {
        clearTimeout(timer);
        var k = inflight.indexOf(ctl);
        if (k >= 0) inflight.splice(k, 1);
      }
      fetch(url, o.cache || o.signal ? o : undefined).then(json)
        .then(function (v) { done(); ok(v); }, function (e) {
          if (ctl) ctl.abort();                                     // an error status's body is not read either
          done();
          fail(e);
        });
    });
  }
  // The manifest alone answers title and heading queries, so results show at
  // once; each shard fills in its sections' text as it arrives and the search
  // on screen is scored again.
  function load(retry) {
    // A search the reader types after a shard failed starts over from the
    // manifest, revalidated: shard names are content hashes, so a deploy that
    // replaced them leaves the old manifest naming files that no longer exist,
    // and a transient failure costs one manifest while the loaded shards come
    // back from the browser cache. A refresh after a shard lands never retries,
    // or a lasting failure would loop.
    // A manifest that failed to load or parse is revalidated too: the browser
    // may be holding a cached copy the deploy has since replaced.
    var failed = shards.some(function (sh) { return sh.state === 3; });
    if (idx && retry && failed) {
      idx = null; shards = []; revalidate = true;
      inflight.splice(0).forEach(function (c) { c.abort(); });     // the old index's requests are no longer wanted
    }
    if (idx) return Promise.resolve(idx);
    if (!loading) {
      var fresh = revalidate;
      loading = fetchJson(root + 'search.json', fresh ? { cache: 'no-cache' } : null).then(function (m) {
        if (!m || m.v !== 2 || !Array.isArray(m.p) || !Array.isArray(m.s) || !Array.isArray(m.shards)) {
          throw new Error('unknown index format');
        }
        var at = 0;
        shards = m.shards.map(function (s) { var sh = { name: s[0], count: s[1], at: at, state: 0 }; at += s[1]; return sh; });
        if (at !== m.s.length) throw new Error('index shards do not match the manifest');
        idx = m.s.map(function (r) {
          var p = m.p[r[0]];
          return { pg: r[0], t: p[0], u: p[1], a: r[1], h: r[2], x: '', xl: '',
                   tl: p[0].toLowerCase(), hl: r[2].toLowerCase() };
        });
        fetchShards(idx, shards);
        return idx;
      });
      // A failed load is forgotten, so the next keystroke retries it, revalidated.
      loading.then(function () { loading = null; revalidate = false; },
                   function () { loading = null; revalidate = true; });
    }
    return loading;
  }
  // Shard state: 0 not fetched, 1 fetching, 2 loaded, 3 failed (including past
  // the deadline). A shard that lands after its index was replaced is dropped;
  // after a failure the next typed search starts again from the manifest.
  function fetchShards(mine, list) {
    list.forEach(function (sh) {
      sh.state = 1;
      function settle() {
        // Shards landing together (a warm cache) are scored once, not once each.
        if (idx === mine && !refreshTimer) {
