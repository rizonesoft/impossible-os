<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impossible OS -- Page not found</title>
    <meta name="robots" content="noindex, follow">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 24px; }
        a { text-decoration: underline; }
        .skip-link { position: absolute; left: 8px; top: -100px; padding: 8px 16px; background: #ffffff; color: #0000ee; }
        .skip-link:focus { top: 8px; }
        main:focus { outline: none; }
        h1 { font-size: 1.5rem; margin: 0 0 12px; }
    </style>
    <script>
        (function () {
            const match = window.location.pathname.match(/^(.*)\/err\/([0-9a-fA-F]{4})\/?$/);
            if (match) {
                window.location.replace((match[1] || '') + '/err/?code=' + match[2].toLowerCase());
            }
        }());
    </script>
</head>
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <main id="content" tabindex="-1">
        <h1>Page not found</h1>
        <p>Go back to <a href="/">Impossible OS</a>.</p>
    </main>
</body>
</html>
